services:
  # Servidor Web NGINX
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./Beta_engine_SaaS:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  # Backend PHP (Construído a partir do seu Dockerfile)
  php:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./Beta_engine_SaaS:/var/www/html
    depends_on:
      - mariadb
      - redis
      - rabbitmq

  # Banco de Dados
  mariadb:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql

  # Interface Web para Gerenciamento do Banco de Dados
  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      - mariadb

  # Cache em Memória
  redis:
    image: redis:alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # Gerenciador de Filas
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"   # Porta de comunicação da aplicação
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672" # Painel Web do RabbitMQ
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

volumes:
  db_data:
