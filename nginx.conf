server {
    listen 80;
    server_name localhost;

    # Diretório raiz onde os arquivos do SaaS estão montados dentro do contêiner
    # Caso sua aplicação use uma pasta pública (ex: Laravel / Symfony), altere para: /var/www/html/public
    root /var/www/html;

    # Arquivos padrão de índice
    index index.php index.html index.htm;

    # Codificação de caracteres padrão
    charset utf-8;

    # Tamanho máximo permitido para upload de arquivos (útil para SaaS)
    client_max_body_size 100M;

    # Configuração de rotas e URLs amigáveis
    # Tenta servir o arquivo solicitado diretamente; se não existir, redireciona para o index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Desativa logs para favicon e robots para não poluir os arquivos de log
    location = /favicon.ico { 
        access_log off; 
        log_not_found off; 
    }
    location = /robots.txt  { 
        access_log off; 
        log_not_found off; 
    }

    # Bloqueia o acesso a arquivos ocultos (ex: .env, .git, .htaccess) por segurança
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Encaminha requisições de arquivos .php para o contêiner PHP-FPM
    location ~ \.php$ {
        # Retorna 404 caso o arquivo PHP não exista
        try_files $uri =404;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        
        # Nome do serviço definido no docker-compose.yml e a porta padrão do PHP-FPM
        fastcgi_pass php:9000;
        fastcgi_index index.php;

        # Inclui os parâmetros padrões do FastCGI
        include fastcgi_params;

        # Define o caminho real do script que o PHP-FPM deve executar
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Oculta informações da versão do PHP nos cabeçalhos de resposta HTTP
        fastcgi_hide_header X-Powered-By;
    }
}
